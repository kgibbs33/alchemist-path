<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Log in to your Alchemist's Path account to access your courses, track your progress and continue your transformation journey.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — The Alchemist's Path</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:ital,wght@0,300;0,400;0,700;1,300&family=Great+Vibes&display=swap');
:root{--gold:#C8960A;--gold2:#A07800;--text:#E8E4D8;--muted:#8896B0;--bg:#07091A;--bg2:#090D25;--bg3:#0C1135;--border:rgba(200,150,10,.3);--font-head:'Cinzel',serif;--font-body:'Lato',sans-serif;--font-quote:'Great Vibes',cursive;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:radial-gradient(ellipse 130% 60% at 50% 15%,#2E4FA0 0%,#1B2E6E 30%,#0F1638 60%,#07091A 100%);background-color:#07091A;background-attachment:fixed;}
body{font-family:var(--font-body);overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;}
.tap-root{width:100%;display:flex;align-items:center;justify-content:center;}

.login-wrap{width:100%;max-width:420px;}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo-text{font-family:var(--font-head);font-size:.85rem;font-weight:700;color:#b8972a;letter-spacing:.08em;}
.login-logo-sub{font-family:var(--font-body);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:#E8E4D8;opacity:.7;margin-top:.2rem;}
.gold-line{width:40px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:.75rem auto;}

.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:2.5rem 2rem;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#C8960A,transparent);}

.login-title{font-family:var(--font-head);font-size:1.2rem;font-weight:700;color:var(--text);text-align:center;margin-bottom:.35rem;}
.login-subtitle{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:1.75rem;}

.form-group{margin-bottom:1.1rem;}
.form-label{font-family:var(--font-head);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.5rem;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid rgba(200,150,10,.25);border-radius:6px;background:rgba(255,255,255,.75);font-family:var(--font-body);font-size:.92rem;color:var(--text);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--gold);}
.form-input::placeholder{color:var(--muted);opacity:.5;}

.login-btn{width:100%;font-family:var(--font-head);font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0A0A0F;background:linear-gradient(135deg,#FFD700 0%,#C8A400 50%,#FFD700 100%);background-size:200% auto;border:none;padding:15px;cursor:pointer;border-radius:3px;transition:all .3s;margin-top:.5rem;}
.login-btn:hover{background-position:right center;box-shadow:0 0 24px rgba(255,215,0,.4);}

.login-error{display:none;background:rgba(200,50,50,.08);border:1px solid rgba(200,50,50,.25);border-radius:6px;padding:.75rem 1rem;font-size:.83rem;color:#c0392b;margin-bottom:1rem;text-align:center;}
.login-error.show{display:block;}

.login-divider{text-align:center;margin:1.25rem 0;position:relative;}
.login-divider::before{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(200,150,10,.18);}
.login-divider span{background:var(--bg2);padding:0 .75rem;font-size:.72rem;color:var(--muted);position:relative;}

.login-register{text-align:center;font-size:.83rem;color:var(--muted);}
.login-register a{color:var(--gold);font-family:var(--font-head);font-size:.75rem;font-weight:700;letter-spacing:.06em;}

.login-type-btn{font-family:var(--font-head);font-size:.58rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:3px;border:1.5px solid rgba(200,150,10,.3);background:transparent;color:#E8E4D8;cursor:pointer;transition:all .2s;}
.login-type-btn:hover{border-color:var(--gold);color:var(--gold);}
.login-type-btn.active{background:var(--gold);border-color:var(--gold);color:#0A0A0F;}
.back-home{display:block;text-align:center;margin-top:1.25rem;font-family:var(--font-body);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .2s;}
.back-home:hover{color:var(--gold);}
</style>
<style>
/* primary moonlight + sky blooms */
  /* still-water reflection band near the bottom */
  /* polished top sheen */
  /* soft framing vignette in pale blue (keeps focus on content) */
  @keyframes alchemist-breathe {
    from { transform: translate3d(-1.5%,-1%,0) scale(1);    opacity: .92; }
    to   { transform: translate3d(2%,1.5%,0)   scale(1.07); opacity: 1; }
  }
  @keyframes alchemist-breathe-2 {
    from { transform: translate3d(1.5%,1%,0) scale(1.04); opacity: .55; }
    to   { transform: translate3d(-2%,-1.5%,0) scale(1);  opacity: .9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .alchemist-bg__glow, }

</style>
</head>
<body>
<div class="tap-root">
  <div class="login-wrap">

    <div class="login-logo">
      <div class="login-logo-text">The Alchemists Path</div>
      <div class="login-logo-sub">by Andrew A. Porteous</div>
      <div class="gold-line"></div>
    </div>

    <div class="login-card">

      <!-- User Type Selector -->
      <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:1.5px solid rgba(200,150,10,.2);padding-bottom:.75rem;flex-wrap:wrap;">
        <button onclick="setLoginType(this,'Member')" class="login-type-btn active" style="flex:1;min-width:80px;">Member</button>
        <button onclick="setLoginType(this,'Affiliate')" class="login-type-btn" style="flex:1;min-width:80px;">Affiliate</button>
        <button onclick="setLoginType(this,'Admin')" class="login-type-btn" style="flex:1;min-width:80px;">Admin</button>
      </div>

      <h1 class="login-title" id="loginTitle" style="display:none;"></h1>
      <p class="login-subtitle" id="loginSubtitle" style="display:none;"></p>

      <div class="login-error" id="loginError" style="display:none;">Incorrect email or password. Please try again.</div>

      <form onsubmit="doLogin(event)" id="loginForm" style="display:none;">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input" type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In as Member &rarr;</button>
      </form>

      <div class="login-divider" id="loginDivider" style="display:none;"><span>or</span></div>
      <p class="login-register" id="loginRegister" style="display:none;">Don't have an account? <a href='lightbluealchemist_register.html'>Create one here</a></p>
    </div>

    <script>
    var loginTypes = {
      Member:    {title:"Member Login",    subtitle:"Welcome back. Sign in to continue your journey.",      btn:"Sign In as Member"},
      Affiliate: {title:"Affiliate Login", subtitle:"Access your affiliate dashboard and referral tools.",   btn:"Sign In as Affiliate"},
      Admin:     {title:"Admin Login",     subtitle:"Administrator access for site and course management.",  btn:"Sign In as Admin"}
    };
    function setLoginType(btn, type){
      document.querySelectorAll(".login-type-btn").forEach(function(b){b.classList.remove("active");});
      btn.classList.add("active");
      document.getElementById("loginTitle").textContent = loginTypes[type].title;
      document.getElementById("loginTitle").style.display = "block";
      document.getElementById("loginSubtitle").textContent = loginTypes[type].subtitle;
      document.getElementById("loginSubtitle").style.display = "block";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("loginDivider").style.display = "flex";
      document.getElementById("loginRegister").style.display = "block";
      document.getElementById("loginBtn").textContent = loginTypes[type].btn + " →";
    }
    </script>

    <a class='back-home' href='index.html'>&larr; Back to Home</a>

  </div>
</div>
<script>
function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  var password = document.getElementById('loginPassword').value;
  var users = JSON.parse(localStorage.getItem('tap_users') || '[]');
  var found = users.find(function(u){ return u.email === email && u.password === password; });

  if(found) {
    localStorage.setItem('tap_user', JSON.stringify(found));
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('loginError').classList.add('show');
  }
}

// If already logged in, go straight to dashboard
if(localStorage.getItem('tap_user')) {
  window.location.href = 'dashboard.html';
}
</script>
<script>
(function(){
var CSS=`
#tap-chat-btn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9000;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#C8960A,#a07800);box-shadow:0 4px 20px rgba(200,150,10,.5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
#tap-chat-btn:hover{transform:scale(1.08);}
#tap-chat-btn svg{width:26px;height:26px;fill:#fff;}
#tap-chat-win{position:fixed;bottom:5rem;right:1.5rem;z-index:9001;width:340px;max-width:calc(100vw - 2rem);background:#0d1f3c;border:1px solid rgba(200,150,10,.3);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden;font-family:'Lato',sans-serif;}
#tap-chat-win.open{display:flex;}
#tap-chat-header{background:linear-gradient(135deg,#0d1f3c,#1a3a6b);padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid rgba(200,150,10,.2);}
#tap-chat-header .ch-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C8960A,#a07800);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0;}
#tap-chat-header .ch-info{flex:1;}
#tap-chat-header .ch-name{font-size:.85rem;font-weight:700;color:#C8960A;font-family:'Cinzel',serif;}
#tap-chat-header .ch-status{font-size:.68rem;color:rgba(255,255,255,.5);}
#tap-chat-header .ch-close{background:none;border:none;color:rgba(255,255,255,.5);font-size:1.3rem;cursor:pointer;padding:0;line-height:1;}
#tap-chat-header .ch-close:hover{color:#fff;}
#tap-chat-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem;max-height:320px;}
#tap-chat-msgs::-webkit-scrollbar{width:3px;}
#tap-chat-msgs::-webkit-scrollbar-thumb{background:rgba(200,150,10,.3);border-radius:3px;}
.tc-msg{max-width:85%;padding:.65rem .9rem;border-radius:12px;font-size:.8rem;line-height:1.55;}
.tc-msg.bot{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);border-bottom-left-radius:3px;align-self:flex-start;}
.tc-msg.user{background:linear-gradient(135deg,#C8960A,#a07800);color:#fff;border-bottom-right-radius:3px;align-self:flex-end;}
.tc-msg a{color:#C8960A;text-decoration:underline;}
.tc-msg.bot a{color:#f0c040;}
#tap-quick-btns{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 1rem;}
.tc-qbtn{background:rgba(200,150,10,.12);border:1px solid rgba(200,150,10,.3);color:#C8960A;border-radius:20px;padding:.35rem .75rem;font-size:.72rem;cursor:pointer;transition:all .2s;}
.tc-qbtn:hover{background:rgba(200,150,10,.25);}
#tap-chat-input-row{display:flex;gap:.5rem;padding:.75rem 1rem;border-top:1px solid rgba(200,150,10,.15);}
#tap-chat-input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(200,150,10,.2);border-radius:20px;padding:.5rem .9rem;color:#fff;font-size:.8rem;outline:none;}
#tap-chat-input::placeholder{color:rgba(255,255,255,.3);}
#tap-chat-send{background:linear-gradient(135deg,#C8960A,#a07800);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#tap-chat-send svg{width:16px;height:16px;fill:#fff;}
`;

var style=document.createElement('style');
style.textContent=CSS;
document.head.appendChild(style);

var html=`
<button id="tap-chat-btn" onclick="tapChatToggle()" aria-label="Open chat">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
</button>
<div id="tap-chat-win">
  <div id="tap-chat-header">
    <div class="ch-avatar">TAP</div>
    <div class="ch-info">
      <div class="ch-name">Alchemist Assistant</div>
      <div class="ch-status">&#9679; Online — here to help</div>
    </div>
    <button class="ch-close" onclick="tapChatToggle()">&times;</button>
  </div>
  <div id="tap-chat-msgs"></div>
  <div id="tap-quick-btns">
    <button class="tc-qbtn" onclick="tapAsk('What is The Alchemist\'s Path?')">What is TAP?</button>
    <button class="tc-qbtn" onclick="tapAsk('How do I find my level?')">Find my level</button>
    <button class="tc-qbtn" onclick="tapAsk('What are the levels?')">The levels</button>
    <button class="tc-qbtn" onclick="tapAsk('How much does it cost?')">Pricing</button>
    <button class="tc-qbtn" onclick="tapAsk('How do I start?')">How to start</button>
    <button class="tc-qbtn" onclick="tapAsk('Talk to a person')">Talk to someone</button>
  </div>
  <div id="tap-chat-input-row">
    <input id="tap-chat-input" type="text" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')tapSend()">
    <button id="tap-chat-send" onclick="tapSend()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
`;

var wrap=document.createElement('div');
wrap.innerHTML=html;
document.body.appendChild(wrap);

var opened=false;
var greeted=false;

window.tapChatToggle=function(){
  opened=!opened;
  var win=document.getElementById('tap-chat-win');
  win.classList.toggle('open',opened);
  if(opened&&!greeted){
    greeted=true;
    setTimeout(function(){tapBot("Welcome to The Alchemist's Path! I'm your guide here. Ask me anything about the programme, levels, glossary, or pricing — or choose a quick topic below.");},300);
  }
};

window.tapAsk=function(q){
  tapUserMsg(q);
  tapRespond(q);
};

window.tapSend=function(){
  var input=document.getElementById('tap-chat-input');
  var q=input.value.trim();
  if(!q)return;
  input.value='';
  tapUserMsg(q);
  tapRespond(q);
};

function tapUserMsg(text){
  var msgs=document.getElementById('tap-chat-msgs');
  var d=document.createElement('div');
  d.className='tc-msg user';
  d.textContent=text;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function tapBot(text){
  var msgs=document.getElementById('tap-chat-msgs');
  var d=document.createElement('div');
  d.className='tc-msg bot';
  d.innerHTML=text;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function tapRespond(q){
  var ql=q.toLowerCase();
  setTimeout(function(){
    if(/thank|thanks|thank you|salamat|cheers|appreciate/i.test(ql)){
      tapBot("You're welcome! Feel free to ask anything else. 😊");
    } else if(/\bhello\b|\bhi\b|\bhey\b|good morning|good afternoon|good evening/i.test(ql)){
      tapBot("Hello! How can I help you today?");
    } else if(/what is|what'?s tap|alchemist path|about tap|this website|use of|purpose of/i.test(ql)){
      tapBot("TAP is a transformation system by Andrew A. Porteous covering <strong>Financial Intelligence, Self-Development & Spiritual Awareness</strong>. Practical steps toward real freedom.");
    } else if(/find my level|my level|quiz|test|which level/i.test(ql)){
      tapBot("Take the free <strong>20-question quiz</strong> to find your level. <a href='lightbluealchemist_quiz.html'>Start here &rarr;</a>");
    } else if(/levels|stages|lead|iron|steel|copper|silver|gold|palladium|tin/i.test(ql)){
      tapBot("<strong>7 levels:</strong> Tin, Lead, Iron, Steel, Copper, Silver, Gold + Palladium (Mastery). Each has 12 modules. <a href='lightbluealchemist_levels.html'>View levels &rarr;</a>");
    } else if(/cost|price|how much|payment|fee|euro|subscription|member/i.test(ql)){
      tapBot("<strong>&euro;5.55/month</strong> — individual membership<br><strong>&euro;19.99/month</strong> — 12 for 12 Group with Andrew");
    } else if(/start|begin|how to|getting started/i.test(ql)){
      tapBot("Start with the free quiz to find your level, then go from there. <a href='lightbluealchemist_howtostart.html'>How to Start &rarr;</a>");
    } else if(/glossary|terms|definitions|words/i.test(ql)){
      tapBot("Over <strong>2,776 terms</strong> — Financial, Self-Development & Spiritual. Free, no login needed. <a href='lightbluealchemist_glossary.html'>Open Glossary &rarr;</a>");
    } else if(/group|12 for 12|community|biweekly|meeting/i.test(ql)){
      tapBot("<strong>12 for 12 Group</strong> — 12-month programme with Andrew. Biweekly meetings + community. <a href='lightbluealchemist_group.html'>Learn more &rarr;</a>");
    } else if(/andrew|who is|trainer|coach/i.test(ql)){
      tapBot("Andrew A. Porteous — trainer, coach, 35+ years experience. Financially free at 40. Based in Germany. <a href='lightbluealchemist_about.html'>His story &rarr;</a>");
    } else if(/modules|courses|lessons|curriculum/i.test(ql)){
      tapBot("<strong>12 modules per level.</strong> Module 1 = free assessment. Modules 2–11 = learning. Module 12 = final assessment. Lead level available now.");
    } else if(/certificate|cert|completion/i.test(ql)){
      tapBot("Yes! Printable certificates are issued when you complete each level.");
    } else if(/contact|email|help|support|person|vanesa|human|real/i.test(ql)||/talk to/i.test(ql)){
      tapBot("Contact <strong>Vanesa</strong> for personal support. <a href='lightbluealchemist_about.html#contact'>Contact form &rarr;</a>");
    } else if(/login|log in|sign in|account|register/i.test(ql)){
      tapBot("<a href='lightbluealchemist_login.html'>Log in &rarr;</a> or <a href='lightbluealchemist_register.html'>Create account &rarr;</a>");
    } else {
      tapBot("This website is <strong>The Alchemist's Path</strong> — a step-by-step transformation system by Andrew A. Porteous covering Financial Intelligence, Self-Development, and Spiritual Awareness. You start with a free quiz to find your level, then progress through courses, eBooks, and community support.<br><br>Not sure where to begin? <a href='lightbluealchemist_quiz.html'>Take the free quiz &rarr;</a>");
    }
  },600);
}

})();

</script>
</body>
</html>
